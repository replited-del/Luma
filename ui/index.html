<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' luma-media: data:; media-src luma-media:; connect-src 'self' luma-media:; object-src 'none'; base-uri 'none'">
  <title>Luma</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-windows">
  <div class="titlebar"><div class="titlebar-brand">Luma <span data-i18n="Ваша музыка. Ваш ритм.">Ваша музыка. Ваш ритм.</span></div><div class="windows-controls"><button data-window="minimize" aria-label="Свернуть" data-i18n-aria="Свернуть"><svg viewBox="0 0 16 16"><path d="M3 8h10"/></svg></button><button id="windowsMaximize" data-window="maximize" aria-label="Развернуть" data-i18n-aria="Развернуть"><svg viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9"/></svg></button><button class="windows-close" data-window="close" aria-label="Закрыть" data-i18n-aria="Закрыть"><svg viewBox="0 0 16 16"><path d="m3 3 10 10M3 13 13 3"/></svg></button></div></div>
  <div class="app">
    <aside class="sidebar">
      <div class="window-controls"><button class="dot red" data-window="close" aria-label="Закрыть" data-i18n-aria="Закрыть"></button><button class="dot yellow" data-window="minimize" aria-label="Свернуть" data-i18n-aria="Свернуть"></button><button class="dot green" data-window="maximize" aria-label="Развернуть" data-i18n-aria="Развернуть"></button></div>
      <div class="brand"><span class="brand-mark">l</span><span>luma<span class="brand-period">.</span></span></div>
      <span class="nav-label" data-i18n="ВАШЕ ПРОСТРАНСТВО">ВАШЕ ПРОСТРАНСТВО</span>
      <nav id="navigation">
        <button class="nav-item active" data-view="home"><span data-icon="home"></span><span data-i18n="Главная">Главная</span></button>
        <button class="nav-item" data-view="library"><span data-icon="music"></span><span data-i18n="Все треки">Все треки</span><span class="nav-count" id="trackCount">0</span></button>
        <button class="nav-item" data-view="albums"><span data-icon="album"></span><span data-i18n="Альбомы">Альбомы</span></button>
        <button class="nav-item" data-view="favorites"><span data-icon="heart"></span><span data-i18n="Любимые">Любимые</span></button>
      </nav>
      <div class="playlist-label"><span class="nav-label" data-i18n="ПЛЕЙЛИСТЫ">ПЛЕЙЛИСТЫ</span><button id="newPlaylist" class="icon-button" title="Создать плейлист" aria-label="Создать плейлист" data-i18n-title="Создать плейлист" data-i18n-aria="Создать плейлист"><span data-icon="plus"></span></button></div>
      <div id="playlistNav" class="playlist-nav"></div>
      <div class="sidebar-bottom"><div class="local-label"><span class="status-dot"></span><span data-i18n="Локальная библиотека">Локальная библиотека</span></div><button id="settingsButton" class="nav-item"><span data-icon="settings"></span><span data-i18n="Настройки">Настройки</span></button><div class="sidebar-foot" data-i18n="Ваша музыка. Ваш ритм.">Ваша музыка. Ваш ритм.</div></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="breadcrumbs"><button id="backButton" class="icon-button" aria-label="Назад" data-i18n-aria="Назад" disabled><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button><span id="breadcrumb">Главная</span></div><div class="topbar-actions"><div class="search"><span data-icon="search"></span><input id="search" placeholder="Поиск в вашей музыке" data-i18n-placeholder="Поиск в вашей музыке" autocomplete="off" aria-label="Поиск музыки" data-i18n-aria="Поиск музыки"><kbd>Ctrl K</kbd><button id="clearSearch" class="icon-button" aria-label="Очистить поиск" data-i18n-aria="Очистить поиск" hidden><span data-icon="close"></span></button></div><button class="import-button" id="importButton"><span data-icon="plus"></span><span data-i18n="Добавить музыку">Добавить музыку</span></button><button id="quickSettings" class="icon-button" aria-label="Настроить интерфейс" data-i18n-aria="Настроить интерфейс" title="Настройки" data-i18n-title="Настройки"><span data-icon="settings"></span></button></div></header>
      <main id="content"></main>
    </div>
    <footer class="player">
      <div id="miniVisualizer" class="audio-visualizer mini-visualizer" data-visualizer>
        <canvas role="img" aria-label="Спектр музыки" data-i18n-aria="Спектр музыки"></canvas>
        <div class="visualizer-meters"><label><span data-i18n="Громкость">Громкость</span><span class="signal-meter" data-meter="level" role="meter" aria-label="Громкость музыки" data-i18n-aria="Громкость музыки" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></span></label><label><span data-i18n="Бас">Бас</span><span class="signal-meter bass-meter" data-meter="bass" role="meter" aria-label="Уровень баса" data-i18n-aria="Уровень баса" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></span></label></div>
      </div>
      <button id="nowCover" class="player-art artwork tone-0" aria-label="Открыть плеер" data-i18n-aria="Открыть плеер"><span data-icon="music"></span></button>
      <div class="player-info"><button id="nowTitle" class="plain-button">Выберите свой первый трек</button><span id="nowArtist">Музыка начинается с вас</span></div>
      <button class="icon-button player-like" id="playerFavorite" aria-label="Добавить в любимые" data-i18n-aria="Добавить в любимые"><span data-icon="heart"></span></button>
      <div class="transport"><div class="transport-buttons"><button class="icon-button" id="shuffle" aria-label="Перемешать" title="Перемешать"><span data-icon="shuffle"></span></button><button class="icon-button" id="previous" aria-label="Предыдущий трек"><span data-icon="previous"></span></button><button class="play-button" id="play" aria-label="Воспроизвести"><span data-icon="play"></span></button><button class="icon-button" id="next" aria-label="Следующий трек"><span data-icon="next"></span></button><button class="icon-button" id="repeat" aria-label="Повтор" title="Повтор выключен"><span data-icon="repeat"></span></button></div><div class="timeline"><span id="elapsed">0:00</span><div id="waveformSeek" class="waveform-seek waveform-enabled"><canvas id="trackWaveform" aria-hidden="true"></canvas><input type="range" id="seek" min="0" max="100" step="0.1" value="0" aria-label="Позиция воспроизведения"></div><span id="duration">0:00</span></div></div>
      <div class="player-right"><span class="quality-badge" id="quality">LOCAL</span><button class="icon-button" id="eqButton" aria-label="Эквалайзер" title="Эквалайзер"><span data-icon="sliders"></span></button><button class="icon-button" id="queueButton" aria-label="Очередь" title="Очередь"><span data-icon="queue"></span></button><button class="icon-button" id="mute" aria-label="Выключить звук"><span data-icon="volume"></span></button><input type="range" id="volume" min="0" max="1" step="0.01" value="0.7" aria-label="Громкость"></div>
    </footer>
  </div>
  <aside id="queuePanel" class="queue-panel" hidden></aside>
  <div id="modalRoot"></div>
  <div id="dropOverlay" class="drop-overlay" hidden><div><span data-icon="download"></span><h2 data-i18n="Отпустите музыку здесь">Отпустите музыку здесь</h2><p data-i18n="Файлы и папки — всё останется на вашем ПК">Файлы и папки — всё останется на вашем ПК</p></div></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <audio id="audio" crossorigin="anonymous" preload="metadata"></audio>
  <audio id="audioNext" crossorigin="anonymous" preload="auto"></audio>
  <script src="i18n.js"></script>
  <script src="visualizer.js"></script>
  <script src="playback.js"></script>
  <script src="waveform.js"></script>
  <script src="app.js"></script>
</body>
</html>
